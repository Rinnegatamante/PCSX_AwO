name: CI (PS Vita)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vita:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PCSX AwO
        uses: actions/checkout@v5
        with:
          path: pcsx-rearmed
          submodules: recursive
          persist-credentials: false

      - name: Check out High Octane renderer headers
        uses: actions/checkout@v5
        with:
          repository: Rinnegatamante/Crash-Team-Racing-High-Octane
          ref: b561a98345442e8416e0479dcd9d12b7239cd0d1
          path: ctr-native
          persist-credentials: false

      - name: Check out vitaGL
        uses: actions/checkout@v5
        with:
          repository: Rinnegatamante/vitaGL
          ref: 36f512ea80a9cdf9c01875ec163313bda7cd26b6
          path: vitaGL-pcsx-rearmed
          persist-credentials: false

      - name: Check out SDL3 with vitaGL backend
        uses: actions/checkout@v5
        with:
          repository: Fancy2209/SDL
          ref: 4d21caad991a60ae61daf64334cc45063bd23b0c
          path: sdl3-vitagl
          persist-credentials: false

      - name: Build and test inside VitaSDK
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/pcsx-rearmed \
            gnuton/vitasdk-docker:20250520 \
            bash tools/ci/build-vita.sh

      - name: Upload Vita VPK
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-awo-vita
          path: |
            pcsx-rearmed/pcsx-awo.vpk
            pcsx-rearmed/eboot.bin
          if-no-files-found: error
          retention-days: 14
